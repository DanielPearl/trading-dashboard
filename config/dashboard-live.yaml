# Multi-bot trading dashboard — LIVE (real money) variant.
#
# Mirrors config/dashboard.yaml but with the three knobs that matter
# for the live/sim split flipped:
#
#   1. mode: live  → header renders "Kalshi LIVE Trading" + a
#      red REAL MONEY banner; body data-mode="live" so CSS swaps
#      to the warning palette.
#   2. port: 8081  → independent HTTP server, accessed via
#      http://<droplet>:8081/. The sim dashboard stays on 8080.
#   3. every <bot>_trader.enabled: false  → no bot threads spin up
#      until you opt one in. The page renders the registry, the
#      toggles, and an empty-state for each bot card; nothing
#      ever calls Kalshi's order endpoint until you flip a
#      bot's enabled to true (AND that bot has a live executor
#      written, which is a separate project — see the chat
#      transcript for context).
#
# Bot data paths point at parallel "live.db" / "outputs-live/" files
# under each bot's existing repo so the live dashboard reads from a
# completely separate set of files than the sim dashboard. These
# files do NOT exist yet — they'll be created the first time a live
# executor writes to them. Until then each bot card shows the
# friendly "no data" empty state, which is the right UX for "live
# trading is wired up but nothing's running".
#
# IMPORTANT: the trading-dashboard-live.service systemd unit also
# sets KALSHI_BOT_STATES_PATH=/root/trading-dashboard/data/bot_states_live.json
# so toggling a bot on in sim doesn't accidentally enable it for
# real money (and vice versa).

host: "0.0.0.0"
port: 8081

mode: live

bots:
  - key: gas-prices
    name: Retail Gas Prices
    db_path: /root/gas-prices/data/live.db
    decisions_path: /root/gas-prices/data/decisions-live.jsonl
    series_ticker: KXAAAGASW
    data_source: "FRED EIA + AAA gas survey"
    display:
      underlying_label: Retail gas price
      underlying_unit: "$"
      underlying_decimals: 2
      unit_position: prefix
      chart_period_minutes: 1440
  - key: unemployment-claims
    name: Jobless Claims
    db_path: /root/unemployment-claims/data/live.db
    decisions_path: /root/unemployment-claims/data/decisions-live.jsonl
    series_ticker: KXJOBLESSCLAIMS
    data_source: "FRED ICSA"
    display:
      underlying_label: Initial jobless claims
      underlying_unit: "K"
      underlying_decimals: 0
      unit_position: suffix
      divisor: 1000.0
      chart_period_minutes: 1
      watchlist_title_use_event: true
      question_format: at_least_full
  - key: nba
    name: NBA Forecast
    dashboard_type: sport
    db_path: /root/nba/data/live.db
    decisions_path: /root/nba/data/decisions-live.jsonl
    watchlist_json_path: /root/nba/data/outputs-live/watchlist.json
    sim_state_path: /root/nba/data/outputs-live/sim_state.json
    # Shared with sim — training artifacts are mode-agnostic. The
    # sport adapter (run on the SIM side) writes this file from
    # NBA's sim.db model_snapshots table; the live side just
    # reads it.
    metrics_path: /root/nba/data/processed/artifacts/metrics.json
    series_ticker: KXNBAGAME
    data_source: "ESPN box scores + NBA stats API"
    seasons:
      - name: "NBA 2025-26 Season"
        start: "2025-10-21T23:00:00Z"
        end:   "2026-06-22T03:00:00Z"
    display:
      underlying_label: Home team ELO (pre-game)
      underlying_unit: ""
      underlying_decimals: 0
      unit_position: none
      chart_period_minutes: 1440
      prediction_period_label: this game
  - key: cpi
    name: Consumer Price Index
    db_path: /root/cpi/data/live.db
    decisions_path: /root/cpi/data/decisions-live.jsonl
    series_ticker: KXCPICORE
    data_source: "FRED CPILFESL + Cleveland Fed nowcast"
    display:
