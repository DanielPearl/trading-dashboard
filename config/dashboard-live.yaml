# Display thresholds — same defaults as sim. Each bot's effective_config
# would override these once it's actually running, same as the sim side.
risk:
  bet_size_cents: 100
  max_open_positions: 1
  max_total_exposure_cents: 200
  max_bets_per_day: 50
  cooldown_seconds_same_market: 1800

edge:
  min_model_confidence: 0.40
  min_ev_per_contract: 0.03
  min_prob_edge_over_breakeven: 0.05
  min_raw_model_edge: 0.06
  max_entry_price_cents: 70
  min_model_accuracy: 0.55

hedge:
  enabled: true
  profit_lock_cents: 20
  stop_loss_cents: 15
  hedge_size_fraction: 0.5

validators:
  min_book_depth_contracts: 100
  max_spread_cents: 8
  min_minutes_to_close: 30
  max_minutes_to_close: 10080
  prob_bounds_cents: [15, 85]
  min_volume: 50
  min_open_interest: 50
  min_depth_at_best_ask: 25
  basis_risk_strike_window_dollars: 0.03
  basis_risk_max_hours_to_close: 6

# ──────────────────────────────────────────────────────────────────────
# Per-bot trader daemons. EVERY ONE IS DISABLED on the live side. To
# trade real money on a specific bot:
#
#   1. Write a live executor for that bot (replace its paper simulator
#      with a real-order path that hits Kalshi via kalshi_sdk). This is
#      per-bot work that doesn't exist yet for most bots.
#   2. Flip that bot's enabled to true here.
#   3. Deploy + restart trading-dashboard-live.service.
#   4. Use the Home-tab toggle to confirm the bot is on. The toggle
#      writes to /root/trading-dashboard/data/bot_states_live.json
#      (separate from the sim file), so the live bot reads its own
#      enabled flag.
#
# Until each bot is opted in here AND has a live executor, the live
# dashboard is a passive viewer. Flipping enabled: true on a bot
# whose code path still calls the paper simulator would write to
# live.db but never place a real order — confusing, but safe.
# ──────────────────────────────────────────────────────────────────────
tennis_trader:
  # Daemon is enabled — but the homepage toggle for tennis on the
  # live dashboard is OFF by default (bot_state.bootstrap_disabled
  # sets it). And the live executor's dry_run is true. So three
  # gates have to align before any real order goes out:
  #   1. enabled: true here (daemon runs)
  #   2. tennis toggle ON in the live dashboard's Home tab
  #   3. live.dry_run set to false here (real money mode)
  # Until you flip #3, the daemon collects + scores + LOGS every
  # decision but never calls Kalshi's order endpoint.
  enabled: true
  repo_path: /root/tennis-forecast
  interval_seconds: 60

  # Presence of the ``live:`` block tells bots/tennis.py to use the
  # TennisLiveExecutor instead of the paper simulator. The executor
  # writes positions to outputs-live/ (isolated from sim's
  # outputs/), runs all kalshi_sdk gates pre-flight, and places
  # IOC limit orders at the watchlist's ask price.
  #
  # All cap values are TIGHTENED, never relaxed, by the hard
  # constants in bots/tennis_live_executor.py. A YAML typo can't
  # widen them past the safety ceiling:
  #   max_open_positions    ≤ 10
  #   max_orders_per_day    ≤ 20
  #   contracts_per_order   ≤ 1
  #   min_edge_pp           ≥ 0.05
  #   max_entry_price_cents ≤ 70
  #   min_entry_price_cents ≥ 15
  #   price_deviation_cents ≤ 3
  live:
    # Safety knob. While true, the executor logs "DRY-RUN would
    # have placed: ..." for every order it WOULD send, but never
    # calls Kalshi's order endpoint. Set to false ONLY after
    # watching dry-run output for at least a full tick cycle and
    # confirming the verdicts match what you'd expect.
    dry_run: true
    sim_state_path: /root/tennis-forecast/data/outputs-live/sim_state.json
    max_open_positions: 10
    max_orders_per_day: 20
    contracts_per_order: 1
    min_edge_pp: 0.05
    max_entry_price_cents: 70
    min_entry_price_cents: 15
    price_deviation_cents: 3

unemployment_trader:
  enabled: false
  repo_path: /root/unemployment-claims
  config_path: /root/unemployment-claims/config/config.yaml

cpi_trader:
  enabled: false
  repo_path: /root/cpi
  config_path: /root/cpi/config/config.yaml

nba_trader:
