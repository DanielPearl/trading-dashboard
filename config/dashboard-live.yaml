# NBA real-money executor — same three-gate arming model as MLB /
# world-cup: daemon enabled here, dry_run: true, and the live page's
# nba Home-tab toggle (bot_states_live.json) is the arming switch.
# Every entry requires a live Pinnacle benchmark line; offseason (no
# open KXNBAGAME markets) the daemon idles.
nba_trader:
  enabled: true
  repo_path: /root/nba
  interval_seconds: 120
  live:
    dry_run: true
    sim_state_path: /root/nba/data/outputs-live/sim_state.json
    max_open_positions: 10   # raised 6 → 10 (hard cap) for $1-stake testing
    # Backstop only — the real limit is max_open_positions
    # ("10 at a time"); slots reopen as positions settle.
    max_orders_per_day: 50
    contracts_per_order: 1
    min_edge_pp: 0.05
    max_entry_price_cents: 80
    min_entry_price_cents: 15
    price_deviation_cents: 3
    prematch_buffer_minutes: 10
    profit_lock_yes_bid_cents: 95

wnba_trader:
  # Flip to true once ready to run WNBA live in dry-run. The ``live:``
  # block below must match dashboard.yaml's — same gates in sim and
  # live, only ``dry_run`` and ``sim_state_path`` differ. Change to
  # ``dry_run: false`` here (and ONLY here) once you've verified
  # dry-run behavior on the live dashboard.
  enabled: false
  repo_path: /root/wnba
  config_path: /root/wnba/config/config.yaml
  live:
    dry_run: true
    sim_state_path: /root/wnba/data/outputs-live/sim_state.json
    max_open_positions: 4
    max_orders_per_day: 6
    contracts_per_order: 1
    min_edge_pp: 0.08
    max_entry_price_cents: 70
    min_entry_price_cents: 15
    price_deviation_cents: 3
    require_pinnacle: true
    profit_lock_yes_bid_cents: 95

gas_trader:
  enabled: false
  repo_path: /root/gas-prices
  config_path: /root/gas-prices/config/config.yaml

survivor_trader:
  enabled: false
  repo_path: /root/survivor-elimination
  interval_seconds: 300

# Table-tennis real-money executor — benchmark-gated: while Pinnacle
# isn't quoting TT (true 2026-07-09) no row is ever buy-eligible, so
# the executor evaluates and does nothing. Same arming model as MLB.
table_tennis_trader:
  enabled: true
  repo_path: /root/table-tennis-forecast
  interval_seconds: 60
  live:
    dry_run: true
    sim_state_path: /root/table-tennis-forecast/data/outputs-live/sim_state.json
    max_open_positions: 10   # raised 6 → 10 (hard cap) for $1-stake testing
    # Backstop only — the real limit is max_open_positions
    # ("10 at a time"); slots reopen as positions settle.
    max_orders_per_day: 50
    contracts_per_order: 1
    min_edge_pp: 0.05
    max_entry_price_cents: 80
    min_entry_price_cents: 15
    price_deviation_cents: 3
    profit_lock_yes_bid_cents: 95

# Darts real-money executor — benchmark-gated: between PDC events
# Pinnacle quotes nothing and no row is buy-eligible. Same arming
# model as MLB.
darts_trader:
  enabled: true
  repo_path: /root/darts-forecast
  interval_seconds: 60
  live:
    dry_run: true
    sim_state_path: /root/darts-forecast/data/outputs-live/sim_state.json
    max_open_positions: 10   # raised 6 → 10 (hard cap) for $1-stake testing
    # Backstop only — the real limit is max_open_positions
    # ("10 at a time"); slots reopen as positions settle.
    max_orders_per_day: 50
    contracts_per_order: 1
    min_edge_pp: 0.05
    max_entry_price_cents: 80
    min_entry_price_cents: 15
    price_deviation_cents: 3
    profit_lock_yes_bid_cents: 95

# World Cup real-money executor — runs in THIS (live) process, so the
# live page's world-cup toggle (bot_states_live.json) gates real
# orders and the sim process stays paper-only. dry_run: true means it
# evaluates + records every order it WOULD place but never touches
# Kalshi's order endpoint; flipping it to false (and restarting
# trading-dashboard-live.service) arms real orders — a deliberate
# manual operator action. 1 contract per order, hard-capped in code.
world_cup_trader:
  enabled: true
  repo_path: /root/world-cup
  interval_seconds: 300
  live:
    dry_run: true
    sim_state_path: /root/world-cup/data/outputs-live/sim_state.json
    max_open_positions: 4
    max_orders_per_day: 6
    contracts_per_order: 1
    min_edge_pp: 0.08
    max_entry_price_cents: 85
    min_entry_price_cents: 10
    price_deviation_cents: 3
    prematch_buffer_minutes: 15
    profit_lock_yes_bid_cents: 95


# MLB real-money executor — runs in THIS (live) process, so the live
# page's mlb toggle (bot_states_live.json) gates real orders and the
# sim process stays paper-only. dry_run: true means it evaluates +
# records every order it WOULD place but never touches Kalshi's order
# endpoint; arming happens either by flipping the mlb Home-tab toggle
# ON on the live dashboard, or by setting dry_run: false here and
# restarting trading-dashboard-live.service. 1 contract per order,
# hard-capped in code. Every entry requires a live Pinnacle/Betfair
# benchmark line (rows without one are never buy-eligible).
mlb_trader:
  enabled: true
  repo_path: /root/baseball
  interval_seconds: 120
  live:
    dry_run: true
    sim_state_path: /root/baseball/data/outputs-live/sim_state.json
    max_open_positions: 10   # raised 6 → 10 (hard cap) for $1-stake testing
    # Backstop only — the real limit is max_open_positions
    # ("10 at a time"); slots reopen as positions settle.
    max_orders_per_day: 50
    contracts_per_order: 1
    min_edge_pp: 0.05
    max_entry_price_cents: 80
    min_entry_price_cents: 15
    price_deviation_cents: 3
    prematch_buffer_minutes: 10
    profit_lock_yes_bid_cents: 95

natgas_trader:
  enabled: false
  repo_path: /root/peak-load

billboard_trader:
  enabled: false
  repo_path: /root/billboard-charts
  interval_seconds: 300
