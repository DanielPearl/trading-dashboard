# Multi-bot trading dashboard config.
#
# The dashboard is a read-only viewer over each bot's SQLite DB. It does
# not place trades, hold credentials, or talk to Kalshi. Edit `bots:` to
# add or remove bots; the rest of the file holds the display thresholds
# shown on the buy-criteria panel (these mirror the gas-bot's gates).

host: "0.0.0.0"
port: 8080

# Mode flag. Two values are wired up:
#   * "sim"  — paper-trading dashboard. Bots write to sim.db, no
#              real orders ever placed. Header reads "Kalshi
#              Simulation Dashboard". Body gets data-mode="sim"
#              so CSS can leave the default GitHub-dark palette.
#   * "live" — real-money trading dashboard. Header reads "Kalshi
#              LIVE Trading", with a "REAL MONEY AT RISK" meta line.
#              Body gets data-mode="live" so CSS can swap to a
#              red-tinted palette as a visual safety cue. The live
#              dashboard reads from a parallel config
#              (dashboard-live.yaml) so the two services have
#              independent bot lists, db paths, and bot_states
#              files. See the upcoming live/sim split for details.
mode: sim

# Bot registry. Listed in display order. db_path is checked at startup —
# bots whose DB is missing render a friendly stub instead of an error.
bots:
  - key: gas-prices
    name: Retail Gas Prices
    db_path: /root/gas-prices/data/sim.db
    decisions_path: /root/gas-prices/data/decisions.jsonl
    series_ticker: KXAAAGASW
    data_source: "FRED EIA + AAA gas survey"
    display:
      underlying_label: Retail gas price
      underlying_unit: "$"
      underlying_decimals: 2
      unit_position: prefix
      # AAA gas survey publishes once per day → daily Kalshi candles
      # are the natural resolution. The chart depicts day-over-day
      # change; hovering snaps to the nearest recorded day.
      chart_period_minutes: 1440
  - key: unemployment-claims
    name: Jobless Claims
    db_path: /root/unemployment-claims/data/sim.db
    decisions_path: /root/unemployment-claims/data/decisions.jsonl
    series_ticker: KXJOBLESSCLAIMS
    data_source: "FRED ICSA"
    display:
      underlying_label: Initial jobless claims
      underlying_unit: "K"
      underlying_decimals: 0
      unit_position: suffix
      # Bot stores raw count (189000); display in thousands → "189K".
      divisor: 1000.0
      # 1-min raw candles — capture every recorded change.
      chart_period_minutes: 1
      # Watchlist Title column uses the Kalshi event title ("Initial
      # jobless claims for the week ending May 9, 2026") for every
      # row instead of the per-strike "200K"-style market title.
      watchlist_title_use_event: true
      # Question column renders the full count with comma separator
      # ("at least 200,000") so the threshold reads as plain English
      # rather than the K-shorthand fmt_underlying produces.
      question_format: at_least_full
  - key: nba
    name: Basketball Forecast (M)
    # NBA is a head-to-head sport bot ("Will Team A win?") — same
    # match-row shape as tennis / table-tennis / darts, so it
    # renders under the unified ``dashboard_type: sport`` page.
    # 2026-07 rearchitecture: the probability source is the devigged
    # Pinnacle moneyline (kalshi_sdk.pinnacle — guest feed + Odds-API
    # cascade), MLB-style. The in-process daemon (nba_trader below)
    # drives the repo's data/dashboard/trading modules directly and
    # writes the JSON paths below; the legacy Elo Bot + sim.db +
    # _sport_adapter path is retired from trading.
    dashboard_type: sport
    # sim.db is the legacy Elo bot's ledger — kept as db_path so the
    # availability check passes on first boot before the new loop's
    # first watchlist write (same idea as world-cup's training CSV).
    db_path: /root/nba/data/sim.db
    decisions_path: /root/nba/data/decisions.jsonl
    watchlist_json_path: /root/nba/data/outputs/watchlist.json
    sim_state_path: /root/nba/data/outputs/sim_state.json
    # Last metrics.json the retired Elo pipeline synthesised — the
    # Models tab renders it as a historical card. The benchmark bot
    # trains nothing, so this file no longer updates.
    metrics_path: /root/nba/data/processed/artifacts/metrics.json
    series_ticker: KXNBAGAME
    series_prefixes: [KXNBAGAME, KXNBASUMMERGAME]
    data_source: "Pinnacle moneylines (guest feed + The Odds API devig)"
    # One window per Kalshi NBA series the bot polls: KXNBAGAME
    # (regular season + playoffs) and KXNBASUMMERGAME (Las Vegas
    # Summer League, July — Pinnacle quotes it, so the bot trades it
    # like any other slate). Update at the start of each season.
    seasons:
      - name: "NBA 2025-26 Season"
        start: "2025-10-21T23:00:00Z"
        end:   "2026-06-22T03:00:00Z"
      - name: "NBA Summer League 2026"
        start: "2026-07-08T00:00:00Z"
        end:   "2026-07-23T06:00:00Z"
    display:
      underlying_label: Home team win prob (Pinnacle)
      underlying_unit: ""
      underlying_decimals: 0
      unit_position: none
      chart_period_minutes: 1440
      # NBA games settle the same evening — "Predicted next game"
      # makes more sense than "next month" or "next week".
      prediction_period_label: this game
  - key: wnba
    name: Basketball Forecast (W)
    # WNBA is a head-to-head sport bot ("Will Team A win?") — same
    # match-row shape as NBA / tennis, so it renders under the unified
    # ``dashboard_type: sport`` page. Its loop writes the standard-bot
    # sim.db schema (positions, market_views, model_snapshots);
    # bots/_sport_adapter.py reads that after each Bot.tick() and emits
    # sport-shape watchlist.json + sim_state.json at the paths below.
    dashboard_type: sport
    db_path: /root/wnba/data/sim.db
    decisions_path: /root/wnba/data/decisions.jsonl
    watchlist_json_path: /root/wnba/data/outputs/watchlist.json
    sim_state_path: /root/wnba/data/outputs/sim_state.json
    # bots/_sport_adapter.py synthesises this metrics.json from the
    # latest model_snapshots row after each tick so the sport Models
    # tab renders WNBA's accuracy / brier / log-loss / ROC AUC card.
    # Shared with the live dashboard (training artifacts are
    # mode-agnostic).
    # Last metrics.json the retired Elo pipeline synthesised —
    # historical card only; the benchmark bot trains nothing.
    metrics_path: /root/wnba/data/processed/artifacts/metrics.json
    series_ticker: KXWNBAGAME
    series_prefixes: [KXWNBAGAME]
    data_source: "Pinnacle moneylines (guest feed + The Odds API devig)"
    # WNBA regular season runs ~mid-May through September.
    seasons:
      - name: "WNBA 2026 Season"
        start: "2026-05-01T00:00:00Z"
        end:   "2026-10-31T03:00:00Z"
    display:
      underlying_label: Home team ELO (pre-game)
      underlying_unit: ""
      underlying_decimals: 0
      unit_position: none
      chart_period_minutes: 1440
      prediction_period_label: this game
  - key: cpi
    name: Consumer Price Index
    db_path: /root/cpi/data/sim.db
    decisions_path: /root/cpi/data/decisions.jsonl
    # KXCPICORE is the **above-style** Core CPI MoM series ("Above
    # X.X%"). The bot trades these because they have wider winning
    # ranges and are a clean fit for the per-threshold classifiers.
    # The exact-bucket KXECONSTATCPICORE series is intentionally NOT
    # the watchlist anchor — see Consumer Price Index/config/config.yaml
    # for why we excluded it.
    series_ticker: KXCPICORE
    data_source: "FRED CPILFESL + Cleveland Fed nowcast"
    display:
      underlying_label: Last realized Core CPI MoM
      underlying_unit: "pp"
      underlying_decimals: 2
      unit_position: suffix
      # MoM percent points are already small numbers — no divisor.
      # Monthly print → daily candle resolution is plenty.
      chart_period_minutes: 1440
      # Override the default "next week" so the watchlist's
      # "Predicted ___" card reads correctly for a monthly print.
      prediction_period_label: next month
  - key: natural-gas
    name: Natural Gas Prices
    # Lives at /root/peak-load/ on the droplet — directory keeps its old
    # name from before the bot was rebuilt around the KXNATGASD market.
    db_path: /root/peak-load/data/sim.db
    decisions_path: /root/peak-load/outputs/daily_signals.json
    series_ticker: KXNATGASD
    data_source: "FRED Henry Hub spot"
    display:
      underlying_label: Henry Hub spot
      underlying_unit: "$"
      underlying_decimals: 2
      unit_position: prefix
      # Daily Henry Hub close. KXNATGASD events that span <48h
      # auto-downgrade to hourly inside fetch_underlying_history (a
      # single-day daily series would be 0-1 points).
      chart_period_minutes: 1440
  - key: tennis
    name: Tennis Forecast
    # Tennis bot (Baseline Break) writes a JSON watchlist + metrics +
    # coefficients files instead of a sim.db. The dashboard reads them
    # directly. db_path/decisions_path are unused but kept set so the
    # generic "available" check has somewhere to look.
    dashboard_type: sport
    series_ticker: BASELINEBREAK
    # Attribute every real Kalshi tennis contract back to this bot in
    # the cross-bot History ledger. Bot trades ATP tour, WTA tour, and
    # ITF Futures / Challengers.
    series_prefixes: [KXATPMATCH, KXWTAMATCH, KXITFMATCH]
    data_source: "Jeff Sackmann tennis_atp + tennis_wta (GitHub)"
    db_path: /root/tennis-forecast/data/outputs/watchlist.json
    decisions_path: /root/tennis-forecast/data/outputs/watchlist.json
    watchlist_json_path: /root/tennis-forecast/data/outputs/watchlist.json
    metrics_path: /root/tennis-forecast/data/processed/artifacts/metrics.json
    coefficients_path: /root/tennis-forecast/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/tennis-forecast/data/outputs/sim_state.json
    # Kalshi runs every ATP / WTA event as a separate competition on
    # KXATPMATCH / KXWTAMATCH. The two tours cover the regular
    # season (Masters 1000 + 500 + 250 + year-end Finals); the four
    # Grand Slams stand on their own because they're run by
    # independent bodies (Tennis Australia, FFT, AELTC, USTA) and
    # have their own brand identities. Tour-level singles events
    # only — Challenger / ITF Futures are tradeable but the bot
    # is configured to stay tour-only.
    seasons:
      - name: "ATP Tour 2026"
        start: "2025-12-29T00:00:00Z"
        end:   "2026-11-22T22:00:00Z"
      - name: "WTA Tour 2026"
        start: "2025-12-29T00:00:00Z"
        end:   "2026-11-15T23:59:59Z"
      - name: "Australian Open 2026"
        start: "2026-01-18T00:00:00Z"
        end:   "2026-02-01T11:00:00Z"
      - name: "Roland-Garros 2026"
        start: "2026-05-24T09:00:00Z"
        end:   "2026-06-07T19:00:00Z"
      - name: "Wimbledon 2026"
        start: "2026-06-29T10:00:00Z"
        end:   "2026-07-12T19:00:00Z"
      - name: "US Open 2026"
        start: "2026-08-24T15:00:00Z"
        end:   "2026-09-13T22:00:00Z"
  - key: survivor
    name: Survivor Elimination
    # Survivor-elimination bot writes the same JSON-output shape as the
    # tennis bot (watchlist.json + metrics.json + coefficients.json),
    # so it routes through a dedicated ``dashboard_type: survivor``
    # adapter that renders a per-contestant table instead of a per-
    # match table. The series_ticker is a *prefix* (KXSURVIVOR) — the
    # bot scans every series matching it and picks up new seasons
    # without a code change.
    dashboard_type: survivor
    series_ticker: KXSURVIVOR
    data_source: "doehm/survivoR (GitHub)"
    db_path: /root/survivor-elimination/data/outputs/watchlist.json
    decisions_path: /root/survivor-elimination/data/outputs/watchlist.json
    watchlist_json_path: /root/survivor-elimination/data/outputs/watchlist.json
    metrics_path: /root/survivor-elimination/data/processed/artifacts/metrics.json
    coefficients_path: /root/survivor-elimination/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/survivor-elimination/data/outputs/sim_state.json
    # Survivor 50 — premiere Feb 25, 2026; ~13-week run to the
    # finale. Kalshi has the season-winner market on KXSURVIVOR
    # ("Who will win Survivor Season 50?"). Times are ET broadcast
    # slot converted to UTC. One window per U.S. cycle — list
    # additional entries when CBS announces the next season.
    seasons:
      - name: "Survivor 50"
        start: "2026-02-26T01:00:00Z"
        end:   "2026-05-21T03:00:00Z"

  - key: table-tennis
    name: Table Tennis Forecast
    # Table-tennis bot writes the same JSON output schema as tennis, so
    # it routes through the same ``dashboard_type: sport`` adapter. The
    # series_ticker meta label distinguishes the cards on the home grid.
    dashboard_type: sport
    series_ticker: TABLETENNIS
    series_prefixes: [KXTABLETENNIS, KXITTFMENMATCH, KXITTFWOMENMATCH, KXTTELITEGAME]
    # 2026-07: probability source is the devigged Pinnacle TT line
    # (guest feed — The Odds API has no table-tennis coverage). Rows
    # without a Pinnacle line are WATCH-only; while Pinnacle isn't
    # quoting TT at all the bot is dormant by design.
    data_source: "Pinnacle moneylines (guest feed devig)"
    db_path: /root/table-tennis-forecast/data/outputs/watchlist.json
    decisions_path: /root/table-tennis-forecast/data/outputs/watchlist.json
    watchlist_json_path: /root/table-tennis-forecast/data/outputs/watchlist.json
    metrics_path: /root/table-tennis-forecast/data/processed/artifacts/metrics.json
    coefficients_path: /root/table-tennis-forecast/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/table-tennis-forecast/data/outputs/sim_state.json
    # Kalshi table-tennis leagues the bot polls:
    #   • KXTABLETENNIS    → TT Elite Series Men (Polish men's
    #     league, year-round).
    #   • KXITTFMENMATCH   → ITTF World Team Championships Men
    #     (biennial; 2026 ended Apr 29 in London, next 2028).
    #   • KXITTFWOMENMATCH → ITTF World Team Championships Women
    #     (same biennial cadence).
    # ITTF dates for 2028 are placeholders — refresh once the ITTF
    # publishes the official calendar.
    seasons:
      - name: "TT Elite Series Men 2026"
        start: "2026-01-01T00:00:00Z"
        end:   "2026-12-31T23:59:59Z"
      - name: "ITTF World Team Championships Men 2028"
        start: "2028-04-24T00:00:00Z"
        end:   "2028-05-01T23:59:59Z"
      - name: "ITTF World Team Championships Women 2028"
        start: "2028-04-24T00:00:00Z"
        end:   "2028-05-01T23:59:59Z"

  - key: billboard
    name: Billboard Hot 100
    # Hot 100 top-10 forecaster. JSON-source for the watchlist tab
    # (model probs / verdicts come from watchlist.json), sim.db-source
    # for positions / closed bets (the live trader writes into the
    # standard simulator schema so the dashboard's shared readers
    # can join positions + position_marks + market_views).
    # Locked to a single Kalshi series; the bot auto-advances to
    # the next weekly event once today's settles.
    dashboard_type: billboard
    series_ticker: KXRANKLISTSONGTOP10
    data_source: "Billboard Hot 100 weekly chart"
    db_path: /root/billboard-charts/data/outputs/sim.db
    decisions_path: /root/billboard-charts/data/outputs/watchlist.json
    watchlist_json_path: /root/billboard-charts/data/outputs/watchlist.json
    metrics_path: /root/billboard-charts/data/processed/artifacts/metrics.json
    coefficients_path: /root/billboard-charts/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/billboard-charts/data/outputs/sim_state.json

  - key: darts
    name: Darts Forecast
    # Darts bot writes the same JSON output schema as tennis (one row
    # per upcoming-or-live match with model + live + market probs and
    # edge/EV/confidence), so it routes through the unified
    # ``dashboard_type: sport`` adapter. The series_ticker meta label
    # is a generic
    # KXDARTS prefix; the bot polls every configured darts series
    # (Premier League, Worlds, PDC tour) under that umbrella.
    dashboard_type: sport
    series_ticker: KXDARTS
    series_prefixes: ["KXDARTS*", KXPDCDARTS]
    # 2026-07: probability source is the devigged Pinnacle darts line
    # (guest feed — The Odds API has no darts coverage). Between PDC
    # events Pinnacle quotes nothing and the bot is dormant by design.
    data_source: "Pinnacle moneylines (guest feed devig)"
    db_path: /root/darts-forecast/data/outputs/watchlist.json
    decisions_path: /root/darts-forecast/data/outputs/watchlist.json
    watchlist_json_path: /root/darts-forecast/data/outputs/watchlist.json
    metrics_path: /root/darts-forecast/data/processed/artifacts/metrics.json
    coefficients_path: /root/darts-forecast/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/darts-forecast/data/outputs/sim_state.json
    # One window per Kalshi darts league. KXDARTSMATCH carries two
    # distinct competitions — "Premier League Darts" (Feb-May tour)
    # and "PDC World Championship" (Dec-Jan event). Each gets its
    # own card; we point the World Championship at the *next*
    # iteration so the card stays useful once the current one ends.
    seasons:
      - name: "PDC Premier League Darts 2026"
        start: "2026-02-05T19:00:00Z"
        end:   "2026-05-28T22:30:00Z"
      - name: "PDC World Championship 2026-27"
        start: "2026-12-15T19:00:00Z"
        end:   "2027-01-03T23:30:00Z"
  - key: world-cup
    name: World Cup Forecast
    # SIM trading enabled (see world_cup_trader below) — the in-process
    # daemon trades the three per-match KXWCGAME outcome markets
    # (team A / team B / TIE in regulation) with the same binary
    # buy/sell logic as the tennis-shape bots. Live trading stays OFF.
    # Models tab renders the offline bake-off report; Training Data tab
    # pages the historical WC-finals match grain.
    dashboard_type: sport
    # No sim.db exists (positions live in sim_state.json). db_path
    # points at the training CSV so (a) availability tracks the repo
    # pull and (b) live_bootstrap skips it (it only auto-creates
    # .db/.json placeholders, which would clobber real artifacts here).
    db_path: /root/world-cup/data/training_data.csv
    decisions_path: /root/world-cup/data/training_data.csv
    watchlist_json_path: /root/world-cup/data/outputs/watchlist.json
    sim_state_path: /root/world-cup/data/outputs/sim_state.json
    series_ticker: KXWCADVANCE
    series_prefixes: [KXWCADVANCE, KXWCGAME]
    data_source: "martj42/international_results (open data, no API key)"
    model_report_path: /root/world-cup/data/processed/artifacts/model_report.json
    training_data_path: /root/world-cup/data/training_data.csv
    training_db_path: /root/world-cup/data/training_history.db
    seasons:
      - name: "FIFA World Cup 2026"
        start: "2026-06-11T00:00:00Z"
        end:   "2026-07-19T23:59:00Z"
  - key: mlb
    name: Baseball Forecast
    # MLB game-winner bot (two binary team markets per KXMLBGAME
    # event → one tennis-shape X-vs-Y row per game). The probability
    # source IS the sharp-book benchmark — devigged Pinnacle
    # moneylines (Betfair Exchange fallback) via kalshi_sdk.pinnacle —
    # so there is no metrics.json / coefficients.json (nothing is
    # trained). Edge = benchmark prob − Kalshi ask; the in-process
    # daemon (mlb_trader below) paper-trades eligible rows.
    dashboard_type: sport
    series_ticker: KXMLBGAME
    series_prefixes: [KXMLBGAME, KXNPBGAME, KXKBOGAME]
    data_source: "Pinnacle moneylines (The Odds API devig, Betfair fallback)"
    # Tennis idiom: no sim.db — db_path points at the watchlist JSON
    # so the generic "available" check tracks the bot's first tick.
    db_path: /root/baseball/data/outputs/watchlist.json
    decisions_path: /root/baseball/data/outputs/watchlist.json
    watchlist_json_path: /root/baseball/data/outputs/watchlist.json
    sim_state_path: /root/baseball/data/outputs/sim_state.json
    # MLB 2026: opening day late March through the World Series.
    # Update at the start of each season.
    seasons:
      - name: "MLB 2026 Season"
        start: "2026-03-25T00:00:00Z"
        end:   "2026-11-08T05:00:00Z"

# ---------------------------------------------------------------------------
# Display thresholds. Mirror the gas-bot's gates so the buy-criteria panel
# shows the actual bar each market must clear.
# ---------------------------------------------------------------------------
risk:
  bet_size_cents: 100
  max_open_positions: 1
  max_total_exposure_cents: 200
  max_bets_per_day: 50
  cooldown_seconds_same_market: 1800

edge:
  # Field names line up with kalshi_sdk.validators.select_side_by_ev so
  # what the dashboard panel renders is what the bots actually gate on.
  # These are FALLBACK values — when a bot writes data/effective_config.json
  # at startup (via kalshi_sdk.write_effective_config) the panel renders
  # the bot's reported live values instead. min_model_accuracy is the
  # one macro-bot-specific extra (gas / claims / CPI run it before the
  # shared SDK gates); harmless 0.0 default for bots that don't care.
  min_model_confidence: 0.40
  min_ev_per_contract: 0.03
  min_prob_edge_over_breakeven: 0.05
  min_raw_model_edge: 0.06
  max_entry_price_cents: 70
  min_model_accuracy: 0.55

hedge:
  enabled: true
  profit_lock_cents: 20
  stop_loss_cents: 0   # OFF per 2026-07-13 audit — SL exits were the largest loss bucket; profit lock stays
  hedge_size_fraction: 0.5

validators:
  min_book_depth_contracts: 100
  max_spread_cents: 8
  min_minutes_to_close: 30
  max_minutes_to_close: 10080
  prob_bounds_cents: [15, 85]
  min_volume: 50
  min_open_interest: 50
  min_depth_at_best_ask: 25
  basis_risk_strike_window_dollars: 0.03
  basis_risk_max_hours_to_close: 6

# In-process trading bots. Each bot used to run as its own systemd
# unit on the droplet; folding them into the dashboard process
# (under src/trading_dashboard/bots/) means one Python interpreter,
# one shared pandas/sklearn import, and the Home-tab toggle actually
# controls trading (the standalone services never read bot_states.json).
#
# When a bot's `enabled` is false the daemon thread isn't started and
# its imports are skipped — the dashboard boots without pulling that
# bot's deps. Flip a bot off here AND remember to stop+disable its
# legacy systemd unit on the droplet to avoid two processes writing
# the same state files.
tennis_trader:
  enabled: true
  # Path to the tennis-forecast repo on disk. The bot module injects
  # this onto sys.path at first tick and imports the upstream
  # predict / signals / simulator functions from there. On the
  # droplet this lives at /root/tennis-forecast (cloned beside
  # /root/trading-dashboard). Override for local-dev runs.
  repo_path: /root/tennis-forecast
  # Poll interval in seconds. Matches the upstream
  # tennis-forecast/config/config.yaml dashboard.refresh_seconds
  # default. Lower = more frequent watchlist refresh + more Kalshi
  # API calls.
  interval_seconds: 60
  # NO ``live:`` block here (removed 2026-07-14). The sim service ran
  # a second real-money tennis executor: config said dry_run but the
  # Home-tab toggle ARMS an executor, and the sim site's tennis toggle
  # is on for paper trading — so both services placed real orders with
  # separate state (duplicate buys: FARWAW/TSIBUS x2, the CHOBAS
  # accidental hedge, and a 78c gain-exit after gain-taking was turned
  # off live). Sim now runs the upstream paper simulator like every
  # other sport; the same exporter gates drive buy_eligible in both.

unemployment_trader:
  enabled: true
  # Path to the unemployment-claims repo. The bot module injects
  # ``<repo_path>/src`` onto sys.path and imports
  # ``unemployment_claims_bot.main.Bot``.
  repo_path: /root/unemployment-claims
  # The upstream Bot reads its own config (poll intervals, gates,
  # model path, sim.db path) from this YAML. Leave at the repo
  # default unless you've got a custom override.
  config_path: /root/unemployment-claims/config/config.yaml

cpi_trader:
  enabled: true
  # Path to the cpi repo (Consumer Price Index — Core CPI MoM bot).
  # Bot module injects ``<repo_path>/src`` onto sys.path and imports
