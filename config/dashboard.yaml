# Multi-bot trading dashboard config.
#
# The dashboard is a read-only viewer over each bot's SQLite DB. It does
# not place trades, hold credentials, or talk to Kalshi. Edit `bots:` to
# add or remove bots; the rest of the file holds the display thresholds
# shown on the buy-criteria panel (these mirror the gas-bot's gates).

host: "0.0.0.0"
port: 8080

# Bot registry. Listed in display order. db_path is checked at startup —
# bots whose DB is missing render a friendly stub instead of an error.
bots:
  - key: gas-prices
    name: Retail Gas Prices
    db_path: /root/gas-prices/data/sim.db
    decisions_path: /root/gas-prices/data/decisions.jsonl
    series_ticker: KXAAAGASW
    display:
      underlying_label: Retail gas price
      underlying_unit: "$"
      underlying_decimals: 2
      unit_position: prefix
      # AAA gas survey publishes once per day → daily Kalshi candles
      # are the natural resolution. The chart depicts day-over-day
      # change; hovering snaps to the nearest recorded day.
      chart_period_minutes: 1440
  - key: unemployment-claims
    name: Jobless Claims
    db_path: /root/unemployment-claims/data/sim.db
    decisions_path: /root/unemployment-claims/data/decisions.jsonl
    series_ticker: KXJOBLESSCLAIMS
    display:
      underlying_label: Initial jobless claims
      underlying_unit: "K"
      underlying_decimals: 0
      unit_position: suffix
      # Bot stores raw count (189000); display in thousands → "189K".
      divisor: 1000.0
      # 1-min raw candles — capture every recorded change.
      chart_period_minutes: 1
      # Watchlist Title column uses the Kalshi event title ("Initial
      # jobless claims for the week ending May 9, 2026") for every
      # row instead of the per-strike "200K"-style market title.
      watchlist_title_use_event: true
      # Question column renders the full count with comma separator
      # ("at least 200,000") so the threshold reads as plain English
      # rather than the K-shorthand fmt_underlying produces.
      question_format: at_least_full
  - key: nba
    name: NBA Forecast
    db_path: /root/nba/data/sim.db
    decisions_path: /root/nba/data/decisions.jsonl
    series_ticker: KXNBAGAME
    display:
      # Underlying anchor for this bot is each home team's pre-game ELO
      # rating — a unitless rating typically in the 1300-1700 range.
      # The home-page card shows it with one decimal.
      underlying_label: Home team ELO (pre-game)
      underlying_unit: ""
      underlying_decimals: 0
      unit_position: none
      chart_period_minutes: 1440
      # NBA games settle the same evening — "Predicted next game"
      # makes more sense than "next month" or "next week".
      prediction_period_label: this game
  - key: cpi
    name: Consumer Price Index
    db_path: /root/cpi/data/sim.db
    decisions_path: /root/cpi/data/decisions.jsonl
    # KXCPICORE is the **above-style** Core CPI MoM series ("Above
    # X.X%"). The bot trades these because they have wider winning
    # ranges and are a clean fit for the per-threshold classifiers.
    # The exact-bucket KXECONSTATCPICORE series is intentionally NOT
    # the watchlist anchor — see Consumer Price Index/config/config.yaml
    # for why we excluded it.
    series_ticker: KXCPICORE
    display:
      underlying_label: Last realized Core CPI MoM
      underlying_unit: "pp"
      underlying_decimals: 2
      unit_position: suffix
      # MoM percent points are already small numbers — no divisor.
      # Monthly print → daily candle resolution is plenty.
      chart_period_minutes: 1440
      # Override the default "next week" so the watchlist's
      # "Predicted ___" card reads correctly for a monthly print.
      prediction_period_label: next month
  - key: natural-gas
    name: Natural Gas Prices
    # Lives at /root/peak-load/ on the droplet — directory keeps its old
    # name from before the bot was rebuilt around the KXNATGASD market.
    db_path: /root/peak-load/data/sim.db
    decisions_path: /root/peak-load/outputs/daily_signals.json
    series_ticker: KXNATGASD
    display:
      underlying_label: Henry Hub spot
      underlying_unit: "$"
      underlying_decimals: 2
      unit_position: prefix
      # Daily Henry Hub close. KXNATGASD events that span <48h
      # auto-downgrade to hourly inside fetch_underlying_history (a
      # single-day daily series would be 0-1 points).
      chart_period_minutes: 1440
  - key: whale-watcher
    name: Whale Watcher
    # Whale bot uses signal-analysis JSONLs instead of a sim.db. db_path
    # is set to signals_path so the existing "available" check behaves
    # sensibly on this entry.
    dashboard_type: whale
    db_path: /root/whale-watcher/data/signal_tracking.jsonl
    decisions_path: /root/whale-watcher/data/signal_tracking.jsonl
    signals_path: /root/whale-watcher/data/signal_tracking.jsonl
    orders_path: /root/whale-watcher/data/orders.jsonl
    # Whale recorder's sqlite store. A separate service (the whale
    # recorder) scans Kalshi's last-24h trade feed once a minute and
    # upserts every ≥$10k bet on an event-based market, then prunes
    # rows whose market has closed. The dashboard's whale page reads
    # from this file so big bets persist past their 24h API window
    # for as long as the underlying contract is still active.
    whales_db_path: /root/whale-watcher/data/whales.db
  - key: rules-parser
    name: Rules Parser
    # Rules-arb bot — parses each watched contract's settlement rules
    # into typed clauses, monitors news for events that match those
    # clauses, and simulates trades on misprices. The dashboard reads
    # rules_intel.db read-only.
    dashboard_type: rules-parser
    db_path: /root/rules-parser/data/rules_intel.db
    decisions_path: /root/rules-parser/data/rules_intel.db
  - key: tennis
    name: Tennis Forecast
    # Tennis bot (Baseline Break) writes a JSON watchlist + metrics +
    # coefficients files instead of a sim.db. The dashboard reads them
    # directly. db_path/decisions_path are unused but kept set so the
    # generic "available" check has somewhere to look.
    dashboard_type: tennis
    series_ticker: BASELINEBREAK
    db_path: /root/tennis-forecast/data/outputs/watchlist.json
    decisions_path: /root/tennis-forecast/data/outputs/watchlist.json
    watchlist_json_path: /root/tennis-forecast/data/outputs/watchlist.json
    metrics_path: /root/tennis-forecast/data/processed/artifacts/metrics.json
    coefficients_path: /root/tennis-forecast/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/tennis-forecast/data/outputs/sim_state.json
  - key: survivor
    name: Survivor Elimination
    # Survivor-elimination bot writes the same JSON-output shape as the
    # tennis bot (watchlist.json + metrics.json + coefficients.json),
    # so it routes through a dedicated ``dashboard_type: survivor``
    # adapter that renders a per-contestant table instead of a per-
    # match table. The series_ticker is a *prefix* (KXSURVIVOR) — the
    # bot scans every series matching it and picks up new seasons
    # without a code change.
    dashboard_type: survivor
    series_ticker: KXSURVIVOR
    db_path: /root/survivor-elimination/data/outputs/watchlist.json
    decisions_path: /root/survivor-elimination/data/outputs/watchlist.json
    watchlist_json_path: /root/survivor-elimination/data/outputs/watchlist.json
    metrics_path: /root/survivor-elimination/data/processed/artifacts/metrics.json
    coefficients_path: /root/survivor-elimination/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/survivor-elimination/data/outputs/sim_state.json

  - key: table-tennis
    name: Table Tennis Forecast
    # Table-tennis bot writes the same JSON output schema as tennis, so
    # it routes through the same ``dashboard_type: tennis`` adapter. The
    # series_ticker meta label distinguishes the cards on the home grid.
    dashboard_type: tennis
    series_ticker: TABLETENNIS
    db_path: /root/table-tennis-forecast/data/outputs/watchlist.json
    decisions_path: /root/table-tennis-forecast/data/outputs/watchlist.json
    watchlist_json_path: /root/table-tennis-forecast/data/outputs/watchlist.json
    metrics_path: /root/table-tennis-forecast/data/processed/artifacts/metrics.json
    coefficients_path: /root/table-tennis-forecast/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/table-tennis-forecast/data/outputs/sim_state.json

  - key: darts
    name: Darts Forecast
    # Darts bot writes the same JSON output schema as tennis (one row
    # per upcoming-or-live match with model + live + market probs and
    # edge/EV/confidence), so it routes through the ``dashboard_type:
    # tennis`` adapter. The series_ticker meta label is a generic
    # KXDARTS prefix; the bot polls every configured darts series
    # (Premier League, Worlds, PDC tour) under that umbrella.
    dashboard_type: tennis
    series_ticker: KXDARTS
    db_path: /root/darts-forecast/data/outputs/watchlist.json
    decisions_path: /root/darts-forecast/data/outputs/watchlist.json
    watchlist_json_path: /root/darts-forecast/data/outputs/watchlist.json
    metrics_path: /root/darts-forecast/data/processed/artifacts/metrics.json
    coefficients_path: /root/darts-forecast/data/processed/artifacts/model_coefficients.json
    sim_state_path: /root/darts-forecast/data/outputs/sim_state.json

# ---------------------------------------------------------------------------
# Display thresholds. Mirror the gas-bot's gates so the buy-criteria panel
# shows the actual bar each market must clear.
# ---------------------------------------------------------------------------
risk:
  bet_size_cents: 100
  max_open_positions: 1
  max_total_exposure_cents: 200
  max_bets_per_day: 50
  cooldown_seconds_same_market: 1800

edge:
  min_edge_yes: 0.08
  min_edge_no: 0.08
  min_model_confidence: 0.40
  min_confidence: 0.30
  min_model_accuracy: 0.55
  min_ev_per_contract: 0.03
  min_prob_edge_over_breakeven: 0.05

hedge:
  enabled: true
  profit_lock_cents: 20
  stop_loss_cents: 15
  hedge_size_fraction: 0.5

validators:
  min_book_depth_contracts: 100
  max_spread_cents: 8
  min_minutes_to_close: 30
  max_minutes_to_close: 10080
  prob_bounds_cents: [15, 85]
  min_volume: 50
  min_open_interest: 50
  min_depth_at_best_ask: 25
  basis_risk_strike_window_dollars: 0.03
  basis_risk_max_hours_to_close: 6
